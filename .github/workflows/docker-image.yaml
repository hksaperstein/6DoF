name: Docker Image CI/CD Generation

on:
    workflow_dispatch:
        inputs:
            logLevel:
                description: 'Log level'
                required: true
                default: 'warning'
                type: choice
                options:
                - info
                - warning
                - debug
            tags:
                description: 'Test scenario tags'
                required: false
                type: string
    push:
        branches:
            - develop

jobs:
    build-docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Login to Docker
              uses: docker/login-action@v4
              with:
                    username: ${{ vars.DOCKERHUB_USERNAME  }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build Docker Image
              run: docker build --file docker/Dockerfile -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_PATH }}
